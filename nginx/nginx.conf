events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # host 网络模式 — 各服务监听 localhost
  # monitor:    8010   guarder:   8080
  # calculator: 8020   tracer:    8000
  upstream monitor   { server 127.0.0.1:8010; }
  upstream calc      { server 127.0.0.1:8020; }
  upstream tracer    { server 127.0.0.1:8000; }
  upstream guarder   { server 127.0.0.1:8080; }

  server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------- 前端 SPA ----------
    location / {
      try_files $uri $uri/ /index.html;
    }

    # ---------- Guarder ----------
    location /api/guarder/ {
      proxy_pass http://guarder/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- Tracer ----------
    location /api/tracer/ {
      proxy_pass http://tracer/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- Analyzer-Monitor ----------
    location /api/monitor/ {
      proxy_pass http://monitor/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- Analyzer-Calculator ----------
    location /api/analyzer/ {
      proxy_pass http://calc/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket upgrade
    location /api/analyzer/ws {
      proxy_pass http://calc/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }
  }
}
