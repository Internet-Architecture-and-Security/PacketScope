version: '3.8'

services:
  # 根目录主服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: packetscope_app
    ports:
      - "4173:4173"
    # volumes:
    #   - ./:/app/
    depends_on:
      - analyzer-monitor
      - analyzer-metrics
      - guarder
      - tracer

  analyzer-monitor:
    build:
      context: ./modules/Analyzer/Monitor
      dockerfile: Dockerfile
    image: packetscope-analyzer-monitor:v1.0
    container_name: packetscope-analyzer-monitor
    privileged: true
    network_mode: host   # ✅ 使用宿主机网络
    volumes:
      - ./modules/Analyzer/Monitor:/monitor

  # 新版 Go/Cilium eBPF Metrics 实现，监听端口 8020
  analyzer-metrics:
    build:
      context: ./modules/Analyzer/Metrics
      dockerfile: Dockerfile
      network: host
    image: packetscope-analyzer-metrics:latest
    container_name: packetscope-analyzer-metrics
    privileged: true
    network_mode: host
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro

  guarder:
    build:
      context: ./modules/Guarder
      dockerfile: Dockerfile
    container_name: packetscope-guarder
    privileged: true           # 如果涉及 eBPF/BPF，可能需要特权模式
    network_mode: host   # ✅ 使用宿主机网络
    volumes:
      - ./modules/Guarder:/guarder
    ports:
      - "8080:8080"

  tracer:
    build:                       # 或使用 image: packetscope-tracer
      context: ./modules/Tracer
      dockerfile: Dockerfile
    container_name: packetscope-tracer
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./modules/Tracer/history:/app/history   # 挂载历史记录目录
      - ./modules/Tracer/GeoLite2-City.mmdb:/app/GeoLite2-City.mmdb
      - ./modules/Tracer/GeoLite2-ASN.mmdb:/app/GeoLite2-ASN.mmdb
      - ./modules/Tracer/risky_ips.json:/app/risky_ips.json


