# PacketScope — 统一入口（nginx:80）+ eBPF 后端（host 网络）
# 部署只需开放一个端口 80；后端服务通过 host 网络互访，无需额外端口映射。

services:
  # ======================== PostgreSQL（独立服务）========================
  postgres:
    image: postgres:16-alpine
    container_name: packetscope-postgres
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - packetscope-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # ======================== 统一入口（nginx + 前端）========================
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: packetscope-nginx
    network_mode: host
    ports:
      - "80:80"
    depends_on:
      - postgres
      - analyzer-monitor
      - analyzer-calculator
      - guarder
      - tracer
    restart: unless-stopped

  # ======================== Analyzer - Monitor ========================
  analyzer-monitor:
    build:
      context: ./modules/Analyzer/Monitor
      dockerfile: Dockerfile
    image: packetscope-analyzer-monitor:v1.0
    container_name: packetscope-analyzer-monitor
    privileged: true
    network_mode: host
    environment:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: password
      PG_DBNAME_PACKET: tcxprober
      PG_DBNAME_FUNCTION: functioninfo
      PG_SSLMODE: disable
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      IFACE: ""
    volumes:
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - packetscope-pgdata:/var/lib/postgresql
    restart: unless-stopped

  # ======================== Analyzer - Calculator ========================
  analyzer-calculator:
    build:
      context: ./modules/Analyzer/Calculator
      dockerfile: Dockerfile
    image: packetscope-analyzer-calculator:v1.0
    container_name: packetscope-analyzer-calculator
    privileged: true
    network_mode: host
    volumes:
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
    depends_on:
      - analyzer-monitor
    restart: unless-stopped

  # ======================== Guarder ========================
  guarder:
    build:
      context: ./modules/Guarder
      dockerfile: Dockerfile
    image: packetscope-guarder:v1.0
    container_name: packetscope-guarder
    privileged: true
    network_mode: host
    environment:
      IFACE: ""
    volumes:
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
    command: >
      sh -c '
      IFACE="$${IFACE:-$$(ip -br route show default | awk "{for(i=1;i<=NF;i++) if($$i==\"dev\") print $$(i+1)}")}";
      IFACE="$${IFACE:-eth0}";
      echo "Using network interface: $$IFACE";
      ./conn-tracker -iface "$$IFACE" -interval 5 -api ":8080"
      '
    restart: unless-stopped

  # ======================== Tracer ========================
  tracer:
    build:
      context: ./modules/Tracer
      dockerfile: Dockerfile
    container_name: packetscope-tracer
    privileged: true
    network_mode: host
    environment:
      PIP_INDEX_URL: ""
      PIP_TRUSTED_HOST: ""
    volumes:
      - ./modules/Tracer/data/geoip:/app/data/geoip:ro
      - ./modules/Tracer/data/history:/app/data/history
      - ./modules/Tracer/data/threat:/app/data/threat
    restart: unless-stopped

volumes:
  packetscope-pgdata:
    driver: local
